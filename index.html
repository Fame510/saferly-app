<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saferly — Your family's scam detector</title>
<style>
:root{--navy:#123553;--blue:#1769aa;--sky:#eaf5fc;--green:#16755f;--mint:#e8f6f0;--ink:#172b3a;--muted:#5b6d79;--line:#d5e1e6;--paper:#fff;--bg:#f5f9fa;--amber:#a96000;--amber-bg:#fff4df;--red:#a72b33;--red-bg:#fff0f0;--safe:#12634f;--safe-bg:#e6f6ee;--radius:18px;--shadow:0 5px 18px rgba(17,53,79,.09)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:18px;line-height:1.5}.appbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.bar-inner{max-width:1200px;margin:auto;padding:13px 24px;display:flex;gap:28px;align-items:center}.brand{font-size:31px;line-height:1;font-weight:800;letter-spacing:-1px;color:var(--navy);text-decoration:none;white-space:nowrap}.brand .mark{color:var(--green)}.nav{display:flex;gap:4px;align-items:center;overflow-x:auto;flex:1}.nav a{color:#3b5264;text-decoration:none;white-space:nowrap;padding:10px 13px;border-radius:10px;font-weight:700;font-size:15px}.nav a:hover,.nav a.active{background:var(--sky);color:#07548b}.main{max-width:1050px;margin:0 auto;padding:34px 24px 56px}.eyebrow{font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--green);margin:0 0 8px}h1{font-size:39px;line-height:1.12;letter-spacing:-.7px;margin:0 0 10px;color:var(--navy)}h2{font-size:27px;line-height:1.2;margin:0 0 12px;color:var(--navy)}h3{font-size:21px;line-height:1.25;margin:0 0 8px;color:var(--navy)}p{margin:0 0 15px}.lead{font-size:21px;color:var(--muted);max-width:730px}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:26px;margin-top:24px;box-shadow:var(--shadow)}.tabs{display:flex;gap:7px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}.tab{border:0;background:transparent;color:#496170;font-weight:700;font-size:17px;padding:13px 15px;border-bottom:4px solid transparent;white-space:nowrap;cursor:pointer}.tab.active{color:var(--blue);border-color:var(--blue)}label{display:block;font-weight:800;margin:0 0 9px;color:var(--navy)}textarea,input{font:inherit;color:var(--ink);width:100%;border:2px solid #b8c9d1;border-radius:12px;padding:14px;background:#fff}textarea{min-height:180px;resize:vertical;font-size:19px}textarea:focus,input:focus{outline:3px solid #a8d8f1;border-color:var(--blue)}.hint{font-size:15px;color:var(--muted);margin-top:7px}.btn{border:0;border-radius:12px;padding:14px 20px;font-weight:800;font-size:18px;cursor:pointer;min-height:52px}.btn-primary{background:var(--blue);color:white}.btn-primary:hover{background:#07588f}.btn-secondary{background:var(--mint);color:#075a48;border:1px solid #afdccf}.btn-danger{background:#fff;border:2px solid #c9696d;color:#8b1c25}.btn.small{font-size:15px;min-height:42px;padding:9px 13px}.submit-row{display:flex;align-items:center;gap:15px;margin-top:20px}.privacy{font-size:14px;color:var(--muted)}.verdict{border-left:8px solid var(--blue)}.verdict.scam{border-left-color:var(--red)}.verdict.likely_scam{border-left-color:var(--amber)}.verdict.unclear{border-left-color:#537c94}.verdict.safe{border-left-color:var(--safe)}.verdict-top{display:flex;justify-content:space-between;gap:20px;align-items:start}.badge{display:inline-block;border-radius:99px;padding:7px 13px;font-size:15px;font-weight:800;letter-spacing:.02em}.badge.scam{background:var(--red-bg);color:var(--red)}.badge.likely_scam{background:var(--amber-bg);color:var(--amber)}.badge.unclear{background:#e9f2f6;color:#345b71}.badge.safe{background:var(--safe-bg);color:var(--safe)}.riskbox{text-align:right;min-width:115px}.riskbox strong{font-size:28px;color:var(--navy);display:block}.riskbox span{font-size:14px;color:var(--muted)}.meter{height:14px;background:#e4edf0;border-radius:20px;overflow:hidden;margin:15px 0 4px}.meter i{height:100%;display:block;border-radius:20px}.meter.scam i{background:var(--red)}.meter.likely_scam i{background:#d88b18}.meter.unclear i{background:#56839d}.meter.safe i{background:var(--safe)}.verdict-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}.info-block{padding:17px;background:#f5f9fa;border-radius:13px}.info-block p{margin:0}.steps{padding-left:26px;margin:7px 0 0}.steps li{padding-left:5px;margin:9px 0}.alert-row{border-top:1px solid var(--line);margin-top:22px;padding-top:18px;display:flex;align-items:center;justify-content:space-between;gap:16px}.alert-row p{margin:0;font-size:16px;color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:4px}.check-list{display:grid;gap:12px}.history-item{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;display:flex;align-items:center;gap:16px;cursor:pointer;font:inherit;color:inherit}.history-item:hover{border-color:#80b6d4;box-shadow:var(--shadow)}.history-text{flex:1;min-width:0}.history-text strong,.history-text span{display:block}.history-text span{font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history-meta{text-align:right;white-space:nowrap}.history-meta small{display:block;color:var(--muted);font-size:14px}.icon-button{background:white;border:1px solid #cad7dc;border-radius:9px;min-width:42px;height:42px;cursor:pointer;color:#526673;font-size:20px}.empty{padding:30px;text-align:center;color:var(--muted);background:white;border:1px dashed #b8cbd4;border-radius:15px}.playbook{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:24px}.play-card{background:white;border:1px solid var(--line);border-radius:15px;padding:21px}.play-card .signs{color:#3b5f72;font-size:16px;margin:8px 0 0}.family-grid,.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.status{padding:14px;border-radius:12px;background:var(--mint);color:#075a48;font-weight:700}.flag{border-left:5px solid var(--red);padding:12px 14px;background:#fff7f7;border-radius:8px;margin:10px 0}.flag strong,.flag span{display:block}.flag span{font-size:15px;color:#5c6871}.form-row{margin-bottom:16px}.usage-number{font-size:46px;font-weight:800;color:var(--blue);line-height:1}.usagebar{height:13px;background:#e3edf0;border-radius:20px;overflow:hidden;margin:12px 0}.usagebar i{display:block;background:var(--green);height:100%}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#123553;color:#fff;padding:14px 19px;border-radius:12px;box-shadow:var(--shadow);font-weight:700;z-index:20;max-width:90%;display:none}.toast.show{display:block}.back{color:var(--blue);font-weight:800;text-decoration:none;cursor:pointer;background:none;border:0;font-size:17px;padding:0;margin-bottom:15px}.source{font-size:15px;color:var(--muted);padding:13px;background:#f5f9fa;border-radius:10px;margin-top:17px;white-space:pre-wrap}.footer{max-width:1050px;margin:0 auto;padding:22px 24px 36px;border-top:1px solid var(--line);color:#60727d;font-size:14px}@media(max-width:700px){body{font-size:17px}.bar-inner{padding:13px 16px;display:block}.brand{display:block;margin-bottom:10px}.nav a{font-size:14px;padding:8px 10px}.main{padding:25px 16px 45px}h1{font-size:32px}.card{padding:19px}.verdict-grid,.family-grid,.settings-grid,.playbook{grid-template-columns:1fr}.verdict-top{display:block}.riskbox{text-align:left;margin-top:12px}.section-head{align-items:start;display:block}.history-item{align-items:flex-start;gap:10px}.history-meta{display:none}.alert-row{display:block}.alert-row .btn{margin-top:14px;width:100%}.submit-row{display:block}.submit-row .btn{width:100%}.privacy{margin-top:10px}.footer{padding-left:16px}}
</style>
</head>
<body>
<header class="appbar"><div class="bar-inner"><a class="brand" href="#/check">safer<span class="mark">ly</span></a><nav class="nav" aria-label="Main navigation"><a data-route="check" href="#/check">Check a Message</a><a data-route="checks" href="#/checks">My Checks</a><a data-route="playbook" href="#/playbook">Scam Playbook</a><a data-route="family" href="#/family">Family</a><a data-route="settings" href="#/settings">Settings</a></nav></div></header>
<main class="main" id="app"></main><footer class="footer">Demo build — analysis runs in your browser. Saferly never sends your message anywhere.</footer><div class="toast" id="toast" role="status"></div>
<script>
const KEY='saferly_state';
const ago=d=>new Date(Date.now()-d*86400000).toISOString();
function initialState(){return {profile:{senior:'Rose',guardian:'Dante',email:'dante@example.com'},alerts:[],checks:[
{id:'seed1',text:'MEDICARE ALERT: Your benefits will be canceled today. Call 1-800-555-0199 now to verify your Medicare number.',mode:'Paste Text',date:ago(2),risk:91,verdict:'scam',type:'Government Impersonation',steal:'Your Medicare number and personal information.',actions:['Do not call the number or share your Medicare number.','Call Medicare using the number on your card if you are worried.','Delete the text and tell a trusted family member.']},
{id:'seed2',text:'Caller transcript: This is the IRS. You owe back taxes and will be arrested today unless you pay with Apple gift cards immediately. Do not tell anyone about this call.',mode:'Paste Call Transcript',date:ago(7),risk:99,verdict:'scam',type:'IRS / Tax Scam',steal:'Gift card money and your personal information.',actions:['Hang up. The IRS does not demand gift cards or threaten arrest by phone.','Do not buy or read gift card numbers to anyone.','Report the call to your state consumer protection office if you wish.']},
{id:'seed3',text:'Hi Rose, your prescription refill is ready at Oak Street Pharmacy. Reply YES if you would like us to prepare it. Questions? Call the number on your prescription label.',mode:'Paste Text',date:ago(12),risk:4,verdict:'safe',type:'Routine Pharmacy Message',steal:'Nothing stands out as an attempt to steal from you.',actions:['This looks like a normal pharmacy refill reminder.','If you want to verify it, call the pharmacy using the number on your prescription label.']}
]}};
let state;try{state=JSON.parse(localStorage.getItem(KEY))||initialState()}catch(e){state=initialState()}function save(){localStorage.setItem(KEY,JSON.stringify(state))}
const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const labels={scam:'SCAM',likely_scam:'LIKELY SCAM',unclear:'UNCLEAR',safe:'LOOKS SAFE'};
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),3500)}
function route(){let r=location.hash.replace('#/','').split('/');return {page:r[0]||'check',id:r[1]}}
function formatDate(x){return new Date(x).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function analyze(input){let t=input.toLowerCase(), score=0, hits=[], types=[];const rules=[
[/\b(urgent|urgently|immediately|act now|today only|final notice|last chance)\b/g,11,'Pressure to act quickly'],[/\b(gift ?card|apple card|google play card|steam card)\b/g,37,'Gift cards'],[/\b(wire transfer|western union|moneygram)\b/g,30,'Money transfer'],[/\b(bitcoin|crypto|cryptocurrency|wallet address)\b/g,24,'Cryptocurrency'],[/\b(irs|internal revenue)\b/g,23,'IRS / Tax Scam'],[/\b(medicare|social security|ssa)\b/g,20,'Government Impersonation'],[/\b(arrested|warrant|jail|lawsuit)\b/g,20,'Threats'],[/\b(verify your account|confirm your account|account.*suspend|unusual activity|security alert)\b/g,16,'Account phishing'],[/\b(click here|bit\.ly|tinyurl|http:\/\/|https:\/\/|\.top\b|\.xyz\b)\b/g,16,'Suspicious link'],[/\b(do not tell|keep.*secret|don't tell)\b/g,22,'Secrecy'],[/\b(grandson|granddaughter|grandchild).{0,60}(trouble|accident|jail|bail)/g,45,'Grandparent Scam'],[/\b(you.{0,25}(won|winner)|lottery|prize|sweepstakes)\b/g,24,'Lottery / Prize Scam'],[/\b(remote access|your computer.{0,25}(virus|infected)|microsoft support|tech support)\b/g,30,'Tech Support Scam'],[/\b(delivery.{0,30}(fee|address)|package.{0,30}(held|failed)|usps.{0,30}(click|fee)|shipping fee)\b/g,22,'Package Delivery Phishing'],[/\b(bank.{0,35}(verify|suspend|click)|password|one.time code|verification code)\b/g,15,'Bank Phishing'],[/\b(romance|love you|dating).{0,80}(money|loan|send)/g,30,'Romance Scam']];
rules.forEach(([re,n,name])=>{if(re.test(t)){score+=n;hits.push(name);types.push(name)}});if(/\b(pay|payment|money|fee)\b/.test(t)&&score>0)score+=7;if(/\b(reply yes|refill ready|prescription|pharmacy)\b/.test(t)&&score<25)score=Math.max(0,score-8);score=Math.min(100,score);let verdict=score>=70?'scam':score>=45?'likely_scam':score>=20?'unclear':'safe';let priority=['Grandparent Scam','IRS / Tax Scam','Government Impersonation','Tech Support Scam','Package Delivery Phishing','Bank Phishing','Lottery / Prize Scam','Romance Scam','Gift cards','Money transfer','Account phishing'];let type=priority.find(x=>types.includes(x))||(verdict==='safe'?'No clear scam signs':'Possible phishing message');let steal;
if(type==='Grandparent Scam')steal='Emergency money by pretending to be a loved one in trouble.';else if(type.includes('Government')||type.includes('IRS'))steal='Your money and personal identification information.';else if(type.includes('Package'))steal='Your card details through a fake delivery payment page.';else if(type.includes('Bank')||type==='Account phishing')steal='Your bank sign-in details or a security code.';else if(type==='Tech Support Scam')steal='Access to your computer, passwords, and bank accounts.';else if(type==='Lottery / Prize Scam')steal='A “fee” payment and personal information for a prize that is not real.';else if(verdict==='safe')steal='Nothing stands out as an attempt to steal from you.';else steal='Personal information or a payment.';
let actions=verdict==='safe'?['This message does not show common scam warning signs.','For extra peace of mind, contact the company using a number you already know—not a link or number in the message.']:verdict==='unclear'?['Do not click links, call back, or share any information yet.','Contact the organization through its official website or a number on your statement.','Ask '+state.profile.guardian+' or another person you trust to look at it with you.']:['Do not reply, click links, call the number, or send money.','Contact the real organization using a trusted phone number or official website.','Save a screenshot if you can, then delete or block the message.','Tell '+state.profile.guardian+' so you do not have to handle it alone.'];
return {risk:score,verdict,type,steal,actions,hits};}
function verdictCard(c,detail=true){let note=c.verdict==='safe'?'This is a reassuring result, not a guarantee.':'You did the right thing by checking before responding.';return `<section class="card verdict ${c.verdict}"><div class="verdict-top"><div><span class="badge ${c.verdict}">${labels[c.verdict]}</span><h2 style="margin-top:12px">${esc(c.type)}</h2><p class="lead" style="font-size:18px">${note}</p></div><div class="riskbox"><strong>${c.risk}/100</strong><span>scam risk score</span></div></div><div class="meter ${c.verdict}"><i style="width:${c.risk}%"></i></div><div class="verdict-grid"><div class="info-block"><h3>What it may be trying to steal</h3><p>${esc(c.steal)}</p></div><div class="info-block"><h3>What to do next</h3><ol class="steps">${c.actions.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div></div>${detail?`<div class="source"><strong>Message checked:</strong> ${esc(c.text)}</div>`:''}${(c.verdict==='scam'||c.verdict==='likely_scam')?`<div class="alert-row"><p>Would you like ${esc(state.profile.guardian)} to know about this? It can help to have support.</p><button class="btn btn-secondary" onclick="sendAlert('${c.id}')">Send Alert to Guardian</button></div>`:''}</section>`}
function renderCheck(){return `<p class="eyebrow">Private, calm, and judgment-free</p><h1>Let’s check that message together.</h1><p class="lead">Paste what you received. We’ll point out warning signs in plain English.</p><section class="card"><div class="tabs"><button class="tab active" data-mode="Paste Text">Paste Text</button><button class="tab" data-mode="Paste Call Transcript">Paste Call Transcript</button><button class="tab" data-mode="Describe the Message">Describe the Message</button></div><label id="inputlabel" for="message">Paste the text you received</label><textarea id="message" placeholder="Example: ‘Your package is waiting. Pay a small fee to receive it…’"></textarea><p class="hint" id="inputhint">Remove names, phone numbers, or account numbers if you prefer.</p><div class="submit-row"><button class="btn btn-primary" onclick="checkMessage()">Check This Message</button><span class="privacy">Analysis stays in this browser.</span></div></section><div id="result"></div>`}
function checkMessage(){let text=document.getElementById('message').value.trim();if(!text){toast('Please paste or describe the message first.');document.getElementById('message').focus();return}let a=analyze(text), mode=document.querySelector('.tab.active').dataset.mode,c={id:'c'+Date.now(),text,mode,date:new Date().toISOString(),...a};delete c.hits;state.checks.unshift(c);save();document.getElementById('result').innerHTML=verdictCard(c);document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'})}
function renderChecks(){let checks=state.checks;return `<div class="section-head"><div><p class="eyebrow">Your private history</p><h1>My Checks</h1><p class="lead">Every message you checked, in one simple place.</p></div></div><section class="card">${checks.length?`<div class="check-list">${checks.map(c=>`<div class="history-item" role="button" tabindex="0" onclick="location.hash='#/checks/${c.id}'"><span class="badge ${c.verdict}">${labels[c.verdict]}</span><div class="history-text"><strong>${esc(c.type)}</strong><span>${esc(c.text)}</span></div><div class="history-meta"><strong>${c.risk}/100</strong><small>${formatDate(c.date)}</small></div><button class="icon-button" title="Delete this check" aria-label="Delete this check" onclick="event.stopPropagation();deleteCheck('${c.id}')">×</button></div>`).join('')}</div>`:'<div class="empty"><h2>No checks yet</h2><p>When you check a message, it will appear here.</p><a class="btn btn-primary" href="#/check">Check a Message</a></div>'}</section>`}
function renderCheckDetail(id){let c=state.checks.find(x=>x.id===id);if(!c)return renderChecks();return `<button class="back" onclick="location.hash='#/checks'">← Back to My Checks</button><p class="eyebrow">Checked ${formatDate(c.date)}</p><h1>Your check result</h1>${verdictCard(c)}`}
function deleteCheck(id){if(confirm('Delete this check from your history?')){state.checks=state.checks.filter(c=>c.id!==id);save();render()}}
const playbook=[['Medicare & health','A caller or text pretends to be Medicare, a doctor, or an insurance plan. They may say benefits will end unless you “verify” your number.','Medicare will not suddenly cancel coverage by text. Never give your Medicare number to an unexpected caller.'],['IRS & tax','A fake IRS agent uses threats—arrest, police, or a lawsuit—to rush you into paying.','The IRS does not demand gift cards, crypto, or immediate payment by phone.'],['Package delivery','A text claims a package is delayed and asks for a small delivery fee or address update.','Look for an odd web address and a request for card details. Use the carrier’s real website instead.'],['Grandparent','Someone says a grandchild is hurt, in jail, or stranded and begs you to keep it secret.','Pause and call the grandchild or another family member on a number you already have.'],['Romance','A new online friend builds trust, then has an emergency and needs money.','Never send money, gift cards, or crypto to someone you have not met and verified.'],['Tech support','A pop-up or caller says your computer has a virus and wants remote access.','Real companies do not call unexpectedly to fix your computer. Close the pop-up; do not call it.'],['Lottery & prize','You “won” a prize but must pay fees or taxes before receiving it.','A real prize does not require gift cards, wire transfers, or a payment to claim it.'],['Bank phishing','A text says your account is frozen or has suspicious activity and asks you to click a link or share a code.','Your bank will not ask for your password or one-time security code by text or an unexpected call.']];
function renderPlaybook(){return `<p class="eyebrow">Learn at your own pace</p><h1>Scam Playbook</h1><p class="lead">Knowing the common tricks makes them easier to spot. It is never your fault if a scammer contacts you.</p><div class="playbook">${playbook.map(x=>`<article class="play-card"><h2>${x[0]}</h2><p>${x[1]}</p><p class="signs"><strong>Watch for:</strong> ${x[2]}</p></article>`).join('')}</div>`}
function renderFamily(){let flagged=state.checks.filter(c=>c.verdict==='scam'||c.verdict==='likely_scam');return `<p class="eyebrow">Support, not surveillance</p><h1>Family</h1><p class="lead">A calm overview for the people who look out for each other.</p><div class="family-grid" style="margin-top:24px"><section class="card" style="margin-top:0"><h2>Linked senior</h2><h3>${esc(state.profile.senior)}</h3><p>Protected with help from guardian ${esc(state.profile.guardian)}.</p><div class="status">● Alert connection is active</div><p class="hint">Alerts are only sent when Rose chooses “Send Alert.”</p></section><section class="card" style="margin-top:0"><h2>Guardian dashboard</h2><p><strong>${esc(state.profile.guardian)}</strong><br><span style="color:var(--muted)">${esc(state.profile.email)}</span></p><p class="hint">${state.alerts.length} alert${state.alerts.length===1?'':'s'} sent from this device.</p></section></div><section class="card"><h2>Recent messages that may need support</h2>${flagged.length?flagged.map(c=>`<div class="flag"><strong>${esc(c.type)} <span class="badge ${c.verdict}" style="margin-left:7px">${labels[c.verdict]}</span></strong><span>Checked ${formatDate(c.date)} · Risk score ${c.risk}/100</span></div>`).join(''):'<div class="empty">No messages have been flagged. That is good news.</div>'}</section>`}
function sendAlert(id){let c=state.checks.find(x=>x.id===id);if(!c)return;state.alerts.unshift({id:'a'+Date.now(),checkId:id,date:new Date().toISOString(),to:state.profile.guardian});save();toast('Alert sent to '+state.profile.guardian+'. You are not alone.');}
function monthChecks(){let now=new Date();return state.checks.filter(c=>{let d=new Date(c.date);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()}).length}
function renderSettings(){let n=monthChecks(),pct=Math.min(100,n/10*100);return `<p class="eyebrow">Your account</p><h1>Settings</h1><p class="lead">Keep your support circle and preferences up to date.</p><div class="settings-grid" style="margin-top:24px"><section class="card" style="margin-top:0"><h2>Your family profile</h2><div class="form-row"><label for="senior">Senior’s name</label><input id="senior" value="${esc(state.profile.senior)}"></div><div class="form-row"><label for="guardian">Guardian’s name</label><input id="guardian" value="${esc(state.profile.guardian)}"></div><div class="form-row"><label for="email">Guardian’s email</label><input id="email" type="email" value="${esc(state.profile.email)}"></div><button class="btn btn-primary" onclick="saveProfile()">Save Profile</button></section><section class="card" style="margin-top:0"><h2>Free plan usage</h2><div class="usage-number">${n}<span style="font-size:22px"> / 10</span></div><p>checks this month</p><div class="usagebar"><i style="width:${pct}%"></i></div><p class="hint">Your free plan includes 10 checks each calendar month in this demo.</p></section></div><section class="card"><h2>Data and privacy</h2><p>Your checks are saved only in this browser so you can revisit them. Clearing data removes your profile, check history, and alerts from this device.</p><button class="btn btn-danger" onclick="clearData()">Clear My Data</button></section>`}
function saveProfile(){let s=document.getElementById('senior').value.trim(),g=document.getElementById('guardian').value.trim(),e=document.getElementById('email').value.trim();if(!s||!g||!e){toast('Please fill in all three profile fields.');return}state.profile={senior:s,guardian:g,email:e};save();toast('Your profile has been saved.')}
function clearData(){if(confirm('Clear all Saferly data on this device? This cannot be undone.')){localStorage.removeItem(KEY);state={profile:{senior:'',guardian:'',email:''},checks:[],alerts:[]};toast('Your data has been cleared.');location.hash='#/check';render()}}
function render(){let r=route(), app=document.getElementById('app');document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.route===r.page));if(r.page==='checks')app.innerHTML=r.id?renderCheckDetail(r.id):renderChecks();else if(r.page==='playbook')app.innerHTML=renderPlaybook();else if(r.page==='family')app.innerHTML=renderFamily();else if(r.page==='settings')app.innerHTML=renderSettings();else app.innerHTML=renderCheck();}
document.addEventListener('click',e=>{if(e.target.classList.contains('tab')){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');let m=e.target.dataset.mode, label=document.getElementById('inputlabel'),hint=document.getElementById('inputhint'),box=document.getElementById('message');if(m==='Paste Text'){label.textContent='Paste the text you received';hint.textContent='Remove names, phone numbers, or account numbers if you prefer.';box.placeholder='Example: “Your package is waiting. Pay a small fee to receive it…”'}else if(m==='Paste Call Transcript'){label.textContent='Paste or type what the caller said';hint.textContent='Short notes are fine. Include what they asked you to do.';box.placeholder='Example: “The caller said I owed taxes and needed to pay today…”'}else{label.textContent='Describe what happened';hint.textContent='Tell us who contacted you and what they asked you to do.';box.placeholder='Example: “A pop-up said my computer was infected and asked me to call a number.”'}}});window.addEventListener('hashchange',render);if(!location.hash)location.hash='#/check';render();
</script>
</body>
</html>
